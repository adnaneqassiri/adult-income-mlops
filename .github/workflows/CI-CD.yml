name: CI  # Human readable name on github actions

on: # On what events we trigger the job
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs: # Workflow start
  test:
    runs-on: ubuntu-latest # Runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # It downloads your repository into the temporary runner.
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.10" # But this action requires configuration.

      - name: Install dependecies
        run: | # Execute shell commands directly.
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        
      - name: Run Tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/income-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/income-api:${{ github.sha }}