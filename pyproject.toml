[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "income"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "PyYAML",
    "scikit-learn",
    "joblib",
    "ucimlrepo",

    "torch",
    "mlflow",

    "fastapi",
    "uvicorn[standard]",

    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
src = ["config.yaml"]