[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
    "scikit-learn",
    "ucimlrepo",
]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
src = ["config.yaml"]
